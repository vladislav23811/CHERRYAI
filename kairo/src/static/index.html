<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kairo · local brilliance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #070910;
      --abyss: #0f1629;
      --glass: rgba(18, 28, 52, 0.72);
      --gold: #d4a853;
      --gold-dim: rgba(212, 168, 83, 0.35);
      --teal: #5eead4;
      --mist: #94a3b8;
      --text: #e8edf7;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--void); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14px; }
    body {
      background-image:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(94, 234, 212, 0.08), transparent 55%),
        radial-gradient(ellipse 90% 60% at 100% 50%, rgba(212, 168, 83, 0.06), transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(30, 58, 95, 0.4), transparent 45%),
        linear-gradient(180deg, var(--void) 0%, var(--abyss) 100%);
      min-height: 100vh;
    }
    .stars {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.35;
      background-image: radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 90% 60%, #fff, transparent),
        radial-gradient(1px 1px at 40% 90%, #cfd8e8, transparent),
        radial-gradient(1px 1px at 70% 15%, #fff, transparent);
      background-size: 100% 100%;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; position: relative; z-index: 1; }
    header { text-align: center; margin-bottom: 2rem; }
    h1 {
      font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 2.35rem;
      letter-spacing: 0.02em; margin: 0 0 0.35rem;
      background: linear-gradient(135deg, var(--gold), var(--teal));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tagline { color: var(--mist); font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; }
    .panel {
      backdrop-filter: blur(14px); background: var(--glass);
      border: 1px solid var(--gold-dim); border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      padding: 1.25rem 1.35rem 1.5rem;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.65rem; align-items: flex-end; margin-bottom: 1rem; }
    label { color: var(--mist); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    select, button {
      font-family: inherit; font-size: 0.85rem; border-radius: 8px; border: 1px solid var(--gold-dim);
      background: rgba(8, 12, 24, 0.85); color: var(--text); padding: 0.45rem 0.75rem;
    }
    button {
      cursor: pointer; background: linear-gradient(135deg, rgba(212, 168, 83, 0.25), rgba(94, 234, 212, 0.15));
      border-color: rgba(212, 168, 83, 0.45); transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(94, 234, 212, 0.12); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .status { font-size: 0.75rem; color: var(--mist); flex: 1; min-width: 140px; text-align: right; }
    .status.ok { color: var(--teal); }
    .status.bad { color: #f87171; }
    .status.streaming {
      animation: pulse-status 1.1s ease-in-out infinite;
      color: var(--gold);
    }
    @keyframes pulse-status {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.72; filter: brightness(1.15); }
    }
    #log {
      height: 340px; overflow-y: auto; padding: 0.85rem; margin-bottom: 1rem;
      border-radius: 10px; background: rgba(4, 8, 18, 0.65); border: 1px solid rgba(148, 163, 184, 0.12);
      scroll-behavior: smooth;
    }
    .msg { margin-bottom: 0.85rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .msg.user { color: var(--teal); border-left: 2px solid var(--teal); padding-left: 0.65rem; }
    .msg.ai { color: var(--text); border-left: 2px solid var(--gold); padding-left: 0.65rem; }
    .msg.ai:has(.md) { white-space: normal; }
    .msg .who { font-size: 0.7rem; color: var(--mist); letter-spacing: 0.12em; margin-bottom: 0.25rem; }
    .msg.ai .md {
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 0.92rem;
      line-height: 1.58;
    }
    .msg.ai .md > :first-child { margin-top: 0; }
    .msg.ai .md > :last-child { margin-bottom: 0; }
    .msg.ai .md pre {
      margin: 0.65rem 0;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(212, 168, 83, 0.22);
      overflow-x: auto;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .msg.ai .md code {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.85em;
      background: rgba(94, 234, 212, 0.09);
      padding: 0.1em 0.38em;
      border-radius: 4px;
    }
    .msg.ai .md pre code { background: none; padding: 0; font-size: inherit; }
    .msg.ai .md a { color: var(--teal); text-decoration: underline; text-underline-offset: 2px; }
    .msg.ai .md blockquote {
      margin: 0.5rem 0;
      padding-left: 0.75rem;
      border-left: 3px solid var(--gold-dim);
      color: var(--mist);
    }
    textarea {
      width: 100%; min-height: 96px; resize: vertical; padding: 0.75rem;
      border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(4, 8, 18, 0.85); color: var(--text); font-family: inherit;
    }
    textarea:focus { outline: none; border-color: var(--gold-dim); box-shadow: 0 0 0 2px rgba(212, 168, 83, 0.15); }
    footer { margin-top: 2rem; text-align: center; font-size: 0.72rem; color: var(--mist); }
    footer .ver { color: var(--gold-dim); letter-spacing: 0.14em; margin-right: 0.35rem; }
    footer a { color: var(--gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    button.stop {
      border-color: rgba(248, 113, 113, 0.55);
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.22), rgba(94, 234, 212, 0.08));
    }
    details.sysbox {
      margin-bottom: 0.85rem;
      color: var(--mist);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }
    details.sysbox summary {
      cursor: pointer;
      user-select: none;
      text-transform: uppercase;
      list-style: none;
    }
    details.sysbox summary::-webkit-details-marker { display: none; }
    details.sysbox textarea {
      margin-top: 0.4rem;
      min-height: 52px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <p class="tagline">καιρός · the right moment</p>
      <h1>Kairo</h1>
      <p class="tagline">Local inference · Cursor MCP · yours</p>
    </header>
    <div class="panel">
      <div class="toolbar">
        <div>
          <label for="model">Model</label><br />
          <select id="model"></select>
        </div>
        <button type="button" id="refreshModels" title="Reload model list from inference backend">Rescan models</button>
        <button type="button" id="newSession">New orbit</button>
        <button type="button" id="send" disabled>Transmit</button>
        <button type="button" id="stopStream" class="stop" disabled title="Stop generation (Escape)">Halt</button>
        <button type="button" id="copyOrbit" title="Copy transcript as markdown">Copy orbit</button>
        <button type="button" id="downloadOrbit" title="Save transcript as .md file">Download orbit</button>
        <button type="button" id="clearLog" title="Clear transcript (session unchanged)">Clear log</button>
        <div id="statusLine" class="status">Warming sensors…</div>
      </div>
      <details class="sysbox">
        <summary>System preamble · optional</summary>
        <textarea id="system" placeholder="Steer tone, stack, or constraints for this chat…" spellcheck="false" aria-label="System preamble"></textarea>
      </details>
      <div id="log" aria-live="polite"></div>
      <textarea id="input" placeholder="Ask Kairo to architect, debug, or sculpt code…" spellcheck="false"></textarea>
    </div>
    <footer>
      <span id="footerVersion" class="ver" aria-live="polite"></span>
      Wire Cursor via MCP · <a href="https://github.com/vladislav23811/CHERRYAI/tree/main/kairo" target="_blank" rel="noopener">source</a>
      · SSE · shell offline via service worker + <code>/vendor/*</code>
    </footer>
  </div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const logEl = $("log");
    const modelSel = $("model");
    const statusLine = $("statusLine");
    let sessionId = null;
    /** @type {AbortController | null} */
    let streamAbort = null;

    function snapshotStatus() {
      return { text: statusLine.textContent, cls: statusLine.className };
    }
    function applyStatus(s) {
      statusLine.textContent = s.text;
      statusLine.className = s.cls;
    }

    function aiMessagePlaintext(el) {
      const md = el.querySelector(".md");
      if (md) return (md.innerText || "").trim();
      const buf = el.querySelector(".buf");
      if (buf) return (buf.textContent || "").trim();
      const clone = el.cloneNode(true);
      clone.querySelector(".who")?.remove();
      return (clone.textContent || "").trim();
    }

    function transcriptMarkdown() {
      const parts = [];
      logEl.querySelectorAll(".msg").forEach((el) => {
        const tag = el.classList.contains("user") ? "YOU" : "KAIRO";
        const body = el.classList.contains("ai") ? aiMessagePlaintext(el) : (() => {
          const clone = el.cloneNode(true);
          clone.querySelector(".who")?.remove();
          return (clone.textContent || "").trim();
        })();
        if (body) parts.push(`### ${tag}\n\n${body}`);
      });
      return parts.join("\n\n");
    }

    function polishAiMarkdown(accEl, raw) {
      const buf = accEl.querySelector(".buf");
      if (!buf || !raw.trim()) return;
      if (typeof marked === "undefined" || typeof DOMPurify === "undefined") return;
      try {
        const html = DOMPurify.sanitize(marked.parse(raw, { breaks: true }));
        buf.remove();
        const wrap = document.createElement("div");
        wrap.className = "md";
        wrap.innerHTML = html;
        accEl.appendChild(wrap);
      } catch (_) {
        buf.textContent = raw;
      }
    }

    function line(kind, text) {
      const div = document.createElement("div");
      div.className = "msg " + kind;
      div.innerHTML = '<div class="who">' + (kind === "user" ? "YOU" : "KAIRO") + '</div>' + escapeHtml(text);
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function clipEp(s, max) {
      if (!s || s.length <= max) return s || "";
      return s.slice(0, Math.floor(max / 2) - 1) + "…" + s.slice(-Math.floor(max / 2) + 2);
    }

    function fmtUptime(ms) {
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (d > 0) return d + "d " + h + "h";
      if (h > 0) return h + "h " + m + "m";
      if (m > 0) return m + "m";
      return sec + "s";
    }

    async function refreshModels() {
      statusLine.textContent = "Scanning inference plane…";
      statusLine.className = "status";
      try {
        const [mr, hr, metaR, probeR] = await Promise.all([
          fetch("/api/models"),
          fetch("/api/health"),
          fetch("/api/meta"),
          fetch("/health"),
        ]);
        const j = await mr.json();
        const hh = await hr.json();
        let uptimeStr = "";
        if (probeR.ok) {
          try {
            const p = await probeR.json();
            if (p.uptime_ms != null) uptimeStr = fmtUptime(p.uptime_ms);
          } catch (_) {}
        }
        let verBit = "";
        if (metaR.ok) {
          try {
            const meta = await metaR.json();
            if (meta.kairo_version) verBit = "v" + meta.kairo_version;
          } catch (_) {}
        }
        const fv = $("footerVersion");
        if (fv) {
          const parts = [];
          if (verBit) parts.push(verBit);
          if (uptimeStr) parts.push("up " + uptimeStr);
          if (parts.length) fv.textContent = parts.join(" · ") + " ·";
        }
        const prev = modelSel.value;
        modelSel.innerHTML = "";
        (j.models || []).forEach((m) => {
          const o = document.createElement("option");
          o.value = m;
          o.textContent = m;
          modelSel.appendChild(o);
        });
        if (prev && [...modelSel.options].some((o) => o.value === prev)) modelSel.value = prev;

        const back = hh.backend || "inference";
        const ep = clipEp(hh.endpoint || "", 52);
        if (hh.ok) {
          statusLine.textContent = (j.models || []).length
            ? `${back} · ${ep} · ${j.models.length} models`
            : `${back} · ${ep} · no models listed`;
          statusLine.className = "status ok";
        } else {
          statusLine.textContent = `${back} · offline · ${hh.detail || ""}`;
          statusLine.className = "status bad";
        }
        $("send").disabled = !hh.ok || !(j.models || []).length;
      } catch (e) {
        statusLine.textContent = "Cannot reach Kairo API";
        statusLine.className = "status bad";
        $("send").disabled = true;
      }
    }

    $("newSession").onclick = async () => {
      try {
        const body = modelSel.value ? { model: modelSel.value } : {};
        const r = await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "session failed");
        sessionId = j.session_id;
        line("ai", "Session locked · id " + sessionId.slice(0, 8) + "… · model " + j.model);
      } catch (e) {
        line("ai", "Could not open session: " + e.message);
      }
    };

    async function streamSend(text) {
      line("user", text);
      const accEl = document.createElement("div");
      accEl.className = "msg ai";
      accEl.innerHTML = '<div class="who">KAIRO</div><span class="buf"></span>';
      logEl.appendChild(accEl);
      const buf = accEl.querySelector(".buf");
      let acc = "";
      const ac = new AbortController();
      streamAbort = ac;
      $("stopStream").disabled = false;
      const st = snapshotStatus();
      statusLine.textContent = "Transmitting…";
      statusLine.className = "status ok streaming";
      const payload = { message: text, session_id: sessionId || undefined, model: sessionId ? undefined : modelSel.value };
      const sys = $("system").value.trim();
      if (sys) payload.system = sys;
      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: ac.signal,
        });
        if (!res.ok) {
          let detail = res.statusText || "error";
          try {
            const t = await res.text();
            const j = JSON.parse(t);
            if (j.error) detail = j.error;
          } catch (_) {}
          buf.textContent = "⚠ HTTP " + res.status + ": " + detail;
          return;
        }
        let hadStreamError = false;
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let carry = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          carry += dec.decode(value, { stream: true });
          let idx;
          while ((idx = carry.indexOf("\n\n")) >= 0) {
            const chunk = carry.slice(0, idx).trim();
            carry = carry.slice(idx + 2);
            if (!chunk.startsWith("data:")) continue;
            const json = chunk.slice(5).trim();
            try {
              const ev = JSON.parse(json);
              if (ev.delta) {
                acc += ev.delta;
                buf.textContent = acc;
                logEl.scrollTop = logEl.scrollHeight;
              }
              if (ev.error) {
                buf.textContent = acc + (acc ? "\n\n" : "") + "⚠ " + ev.error;
                hadStreamError = true;
              }
            } catch (_) {}
          }
        }
        if (!hadStreamError && acc.trim()) polishAiMarkdown(accEl, acc);
        else if (!hadStreamError && !acc.trim()) buf.textContent = "(empty reply)";
      } catch (e) {
        if (e.name === "AbortError") buf.textContent = acc ? acc + "\n\n… transmission halted" : "… transmission halted";
        else buf.textContent = (acc ? acc + "\n\n" : "") + "⚠ " + e.message;
      } finally {
        streamAbort = null;
        $("stopStream").disabled = true;
        applyStatus(st);
      }
    }

    $("send").onclick = async () => {
      const t = $("input").value.trim();
      if (!t) return;
      $("input").value = "";
      $("send").disabled = true;
      try {
        await streamSend(t);
      } catch (e) {
        line("ai", "Stream fault: " + e.message);
      } finally {
        $("send").disabled = false;
      }
    };

    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); }
    });

    $("stopStream").onclick = () => streamAbort && streamAbort.abort();
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && streamAbort) streamAbort.abort();
    });

    $("refreshModels").onclick = () => refreshModels();

    $("copyOrbit").onclick = async () => {
      const md = transcriptMarkdown();
      if (!md) {
        statusLine.textContent = "Nothing to copy yet";
        statusLine.className = "status";
        setTimeout(() => refreshModels(), 1600);
        return;
      }
      try {
        await navigator.clipboard.writeText(md);
        const prev = snapshotStatus();
        statusLine.textContent = "Orbit copied to clipboard";
        statusLine.className = "status ok";
        setTimeout(() => applyStatus(prev), 1400);
      } catch (_) {
        line("ai", "Clipboard blocked — select transcript manually.");
      }
    };

    $("downloadOrbit").onclick = () => {
      const md = transcriptMarkdown();
      if (!md) {
        statusLine.textContent = "Nothing to save yet";
        statusLine.className = "status";
        setTimeout(() => refreshModels(), 1400);
        return;
      }
      const stamp = new Date().toISOString().slice(0, 19).replace(/:/g, "-");
      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "kairo-orbit-" + stamp + ".md";
      a.click();
      URL.revokeObjectURL(a.href);
      const prev = snapshotStatus();
      statusLine.textContent = "Orbit saved · .md";
      statusLine.className = "status ok";
      setTimeout(() => applyStatus(prev), 1400);
    };

    $("clearLog").onclick = () => {
      logEl.innerHTML = "";
      const prev = snapshotStatus();
      statusLine.textContent = "Log cleared";
      statusLine.className = "status ok";
      setTimeout(() => applyStatus(prev), 900);
    };

    if ("serviceWorker" in navigator) {
      addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }

    refreshModels();
  </script>
</body>
</html>
