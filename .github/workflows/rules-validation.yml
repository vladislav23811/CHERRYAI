name: Rules Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate .mdc rules
        run: npm run rules:validate

      - name: Run rules doctor
        run: npm run rules:doctor
